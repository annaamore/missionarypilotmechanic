<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Missionary Pilot Journal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #1a4a2e;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../">✈️ Missionary Pilot Journal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../about/">About</a></li>
          <li class="nav-item"><a class="nav-link" href="../blog/">Blog</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="text-white py-5" style="background-color: #1a4a2e;">
    <div class="container text-center">
      <h1 class="display-5 fw-bold">Get in Touch</h1>
      <p class="lead mb-0">I'd love to hear from you</p>
    </div>
  </section>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body text-center p-5">
            <h3 class="card-title mb-4">Send a Message</h3>
            <form action="https://formspree.io/f/xqerqyvo" method="POST">
              <div class="mb-3">
                <input type="text" name="name" class="form-control" placeholder="Your Name" required style="border: 2px solid #1a4a2e;">
              </div>
              <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Your Email" required style="border: 2px solid #1a4a2e;">
              </div>
              <div class="mb-3">
                <input type="tel" name="phone" class="form-control" placeholder="Phone Number (optional)" style="border: 2px solid #1a4a2e;">
              </div>
              <div class="mb-3">
                <textarea name="message" class="form-control" rows="5" placeholder="Your Message" required style="border: 2px solid #1a4a2e;"></textarea>
              </div>
              <div class="mb-3 p-3 rounded" style="background-color: white; border: 2px solid #1a4a2e;">
                <div class="form-check">
                  <input type="checkbox" name="email_list" class="form-check-input" id="emailList" style="width: 1.5em; height: 1.5em; margin-top: 0.15em; outline: 2px solid black; outline-offset: 1px;">
                  <label class="form-check-label" for="emailList">Join my email list for updates</label>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Send</button>
            </form>
            <hr>
            <p class="mb-2">LinkedIn:</p>
            <p>
              <a href="https://www.linkedin.com/in/annajohnsonpilot/" target="_blank" class="btn btn-outline-primary">linkedin.com/in/annajohnsonpilot</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-4">
    <div class="container">
      <p class="mb-1">&copy; 2026 Missionary Pilot Journal &mdash; built with ✝️ and ☕</p>
      <small class="text-secondary">2 Timothy 1:7</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
